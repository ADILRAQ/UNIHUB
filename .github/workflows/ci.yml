name: CI

# Required GitHub repository secrets for the deploy job:
#   RAILWAY_DEPLOY_HOOK_API      — Railway deploy hook URL for the API service
#   RAILWAY_DEPLOY_HOOK_FRONTEND — Railway deploy hook URL for the frontend service
#
# VITE_API_URL is set as a Railway variable on the frontend service (not a CI secret).
# Railway injects it into the Docker build via frontend/railway.toml [build.buildArgs].

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify (mvn verify)
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only run on direct pushes to main — skip PRs and all other branches
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Railway deploy — API
        run: curl -sf "${{ secrets.RAILWAY_DEPLOY_HOOK_API }}"

      - name: Trigger Railway deploy — Frontend
        run: curl -sf "${{ secrets.RAILWAY_DEPLOY_HOOK_FRONTEND }}"
