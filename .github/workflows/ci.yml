name: CI

# Required GitHub repository secrets for the deploy job:
#   DOCKERHUB_USERNAME  — Docker Hub account username used to push images
#   DOCKERHUB_TOKEN     — Docker Hub personal access token (read/write)
#   VITE_API_URL        — Public base URL of the deployed API (e.g. https://api.unihub.onrender.com)
#   RENDER_DEPLOY_HOOK_API      — Render deploy hook URL for the API service
#   RENDER_DEPLOY_HOOK_FRONTEND — Render deploy hook URL for the frontend service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify (mvn verify)
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only run on direct pushes to main — skip PRs and all other branches
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/unihub-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/unihub-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/unihub-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/unihub-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Trigger Render deploy — API
        run: curl -sf "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Trigger Render deploy — Frontend
        run: curl -sf "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
