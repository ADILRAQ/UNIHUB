spring:
  application:
    name: unihub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:unihub}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Increased to support file uploads (resources up to 50 MB, proofs up to 10 MB).
      # Exceeding these yields a clean 413 (see GlobalExceptionHandler), not a 500.
      max-file-size: 55MB
      max-request-size: 60MB

server:
  port: 8080

app:
  version: "@project.version@"
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:unihub}
  jwt:
    # No default — a missing JWT_SECRET fails startup (same fail-fast as DB creds).
    # Must be at least 32 chars (256 bits) for HMAC-SHA256.
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:16}
  admin:
    # Blank defaults: if unset, AdminSeeder logs a warning and skips (won't crash boot).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:}
  teacher:
    email: ${TEACHER_EMAIL:}
    password: ${TEACHER_PASSWORD:}
    full-name: ${TEACHER_FULL_NAME:}
  student:
    email: ${STUDENT_EMAIL:}
    password: ${STUDENT_PASSWORD:}
    full-name: ${STUDENT_FULL_NAME:}
  seed:
    class-group: ${SEED_CLASS_GROUP:L3 Info A}
